[project]
name = "machine-learning"
version = "0.1.0"
description = "ML playground evolving into a production-ready Machine Learning Platform"
authors = [
    {name = "Trejo Dimas", email = "trejocovantesde@gmail.com"}
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "joblib>=1.2",
    "dvc==3.64.0",
    "kaggle>=1.8.3",
    "gto>=1.9.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/"]
