name: "Promote Model"
run-name: "Promote ${{ inputs.model-name }} to @${{ inputs.alias || inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment that holds the MLflow credentials"
        required: true
        type: environment
      model-name:
        description: "Registered model name (e.g. f1-predictor)"
        required: true
        type: string
      version:
        description: "Model version to promote (empty = latest)"
        required: false
        default: ""
        type: string
      alias:
        description: "MLflow alias to assign (empty = environment name)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  promote-model:
    name: "Promote Model"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_REGISTRY_URI: ${{ secrets.MLFLOW_REGISTRY_URI || secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Check MLflow configuration
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "::error::Set the MLFLOW_TRACKING_URI secret on the '${{ inputs.environment }}' environment."
            exit 1
          fi

      - name: Promote model
        env:
          MODEL_NAME: ${{ inputs.model-name }}
          MODEL_VERSION: ${{ inputs.version }}
          MODEL_ALIAS: ${{ inputs.alias || inputs.environment }}
        run: |
          uv run python -m ml_platform.registry.promote \
            --model-name "$MODEL_NAME" \
            --alias "$MODEL_ALIAS" \
            --version "$MODEL_VERSION" \
            | tee -a "$GITHUB_STEP_SUMMARY"
